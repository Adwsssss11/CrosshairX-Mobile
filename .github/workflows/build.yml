name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --user root

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка buildozer.spec
        run: |
          git config --global --add safe.directory '*'
          printf "y\n" | buildozer init
          sed -i 's/title = My Application/title = Crosshair X/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = crosshairx/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/g' buildozer.spec
          sed -i 's/warn_on_root = 1/warn_on_root = 0/g' buildozer.spec
          sed -i '/\[app\]/a android.permissions = SYSTEM_ALERT_WINDOW\nandroid.accept_sdk_license = True\np4a.branch = master' buildozer.spec

      - name: Сборка APK
        run: |
          yes | buildozer android debug || buildozer android debug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: bin/*.apk
