name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка базовых утилит сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git zip unzip openjdk-11-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          sudo update-java-alternatives -s java-1.11.0-openjdk-amd64 || true
          pip install -q --upgrade pip setuptools wheel
          pip install -q buildozer==1.5.0 "cython<3.0"

      - name: Создание чистого buildozer.spec
        run: |
          rm -f buildozer.spec
          cat << 'EOF' > buildozer.spec
          [app]
          title = Crosshair X
          package.name = crosshairx
          package.domain = org.crosshairx
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = hostpython3==3.11.9,python3==3.11.9,kivy==2.3.1,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = SYSTEM_ALERT_WINDOW
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Сборка APK
        run: |
          set -o pipefail
          (yes | buildozer android debug || buildozer android debug) > build.log 2>&1 || (grep -i -E "error|failure|exception|unsupported" build.log | tail -n 35 && exit 1)

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: bin/*.apk
