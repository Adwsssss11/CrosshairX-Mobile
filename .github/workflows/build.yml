name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка стабильного Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf automake libtool pkg-config cmake libffi-dev libssl-dev unzip zip openjdk-17-jdk
          pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3.0"

      - name: Настройка buildozer.spec (только arm64-v8a)
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Crosshair X/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = crosshairx/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,pyjnius/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = SYSTEM_ALERT_WINDOW/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/g' buildozer.spec

      - name: Сборка APK
        run: |
          buildozer android debug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: bin/*.apk
