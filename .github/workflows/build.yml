name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --user root

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка стабильного Python 3.11 и Buildozer
        run: |
          git config --global --add safe.directory '*'
          apt-get update && apt-get install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update && apt-get install -y python3.11 python3.11-venv python3.11-dev
          python3.11 -m venv /opt/py311
          /opt/py311/bin/pip install --upgrade pip setuptools wheel
          /opt/py311/bin/pip install buildozer==1.5.0 "cython<3.0"

      - name: Создание чистого buildozer.spec
        run: |
          rm -f buildozer.spec
          cat << 'EOF' > buildozer.spec
          [app]
          title = Crosshair X
          package.name = crosshairx
          package.domain = org.crosshairx
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3==3.11.9,kivy==2.3.1,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = SYSTEM_ALERT_WINDOW
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          p4a.branch = master

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Сборка APK
        run: |
          export PATH="/opt/py311/bin:$PATH"
          yes | /opt/py311/bin/buildozer android debug || /opt/py311/bin/buildozer android debug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: bin/*.apk
