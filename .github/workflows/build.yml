name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --user root

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Создание чистого buildozer.spec
        run: |
          git config --global --add safe.directory '*'
          rm -f buildozer.spec
          cat << 'EOF' > buildozer.spec
          [app]
          title = Crosshair X
          package.name = crosshairx
          package.domain = org.crosshairx
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = SYSTEM_ALERT_WINDOW
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Сборка APK
        run: |
          yes | buildozer android debug || buildozer android debug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: bin/*.apk
