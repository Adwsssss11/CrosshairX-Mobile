name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Генерация и настройка buildozer.spec
        run: |
          pip install buildozer
          buildozer init
          sed -i 's/title = My Application/title = Crosshair X/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = crosshairx/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = SYSTEM_ALERT_WINDOW/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

      - name: Сборка APK через Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          buildozer_version: stable

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: ${{ steps.buildozer.outputs.filename }}
