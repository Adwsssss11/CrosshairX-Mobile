name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей Buildozer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf automake libtool pkg-config cmake libffi-dev libssl-dev unzip zip openjdk-17-jdk
          pip install -q --upgrade pip setuptools wheel
          pip install -q buildozer==1.5.0 "cython<3.0"

      - name: Создание чистого buildozer.spec
        run: |
          rm -f buildozer.spec
          cat << 'EOF' > buildozer.spec
          [app]
          title = Crosshair X
          package.name = crosshairx
          package.domain = org.crosshairx
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy==2.3.0,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = SYSTEM_ALERT_WINDOW
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Сборка APK
        run: |
          set -o pipefail
          (yes | buildozer android debug || buildozer android debug) > build.log 2>&1 || (tail -n 60 build.log && exit 1)

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairX-Android-APK
          path: bin/*.apk
